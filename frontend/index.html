<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      The TR mark, at the sizes each client actually reaches for. The .ico is
      first because that is the one a browser guesses at /favicon.ico and the
      one older Windows clients understand; the PNGs beside it are what
      everything current picks up.
    -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0a0a0b" />

    <!--
      The title, description, canonical, Open Graph, Twitter and structured data
      tags are written in here by the seo plugin in vite.config.ts, from the one
      record in src/data/seo.ts. Do not type them out below: the prerender step
      and the Seo component read that same record, and a tag edited only here
      would be the one that disagrees with the rest.
    -->
    <!--seo-head-->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
