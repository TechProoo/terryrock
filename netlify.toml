# ---------------------------------------------------------------------------
# Netlify build configuration.
#
# The repository root holds no package.json — the app lives in frontend/ — so
# `base` moves Netlify into that directory first. Everything else in this file
# is then relative to it, which is why `publish` reads "dist" and not
# "frontend/dist".
#
# The SPA fallback is not here: it lives in frontend/public/_redirects so that
# it is copied into the build output and travels with it. That way a manual
# deploy of the dist folder still routes correctly, where a rule written only
# in this file would be left behind.
#
# The build also writes a real HTML file per route — dist/projects.html and so
# on — each carrying its own title, description, share tags and structured
# data, plus the rules that map /projects to it. See the seo plugin in
# frontend/vite.config.ts. Netlify serves those before it reaches the fallback
# rule, which is the whole point: a link scraper that never runs JavaScript
# still reads the right page.
# ---------------------------------------------------------------------------

[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 8 needs ^20.19 || >=22.12. Pinned so a change to Netlify's default
  # cannot move the build underneath us.
  NODE_VERSION = "22"

# ---------------------------------------------------------------------------
# Caching
#
# Vite fingerprints everything under /assets, so those files can be cached
# forever — a new build produces new filenames. index.html must never be
# cached, or a returning reader keeps loading the previous build's asset names.
# ---------------------------------------------------------------------------

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# The prerendered routes are index.html by another name and carry the same
# risk, so they get the same rule. A header rule matches the request path, not
# the file behind it — so these name the canonical URL a reader actually asks
# for, not the .html file it is served from. Keep them in step with `routeSeo`
# in frontend/src/data/seo.ts.

[[headers]]
  for = "/services"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/systems"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/projects"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/rockwool"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/contact"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# The share card is versioned by hand: changing the picture means changing the
# filename, because every scraper caches the image against its URL and would
# otherwise keep serving the old one. Since the URL only ever names one
# picture, it can be cached properly rather than revalidated on every scrape.
[[headers]]
  for = "/og-cover.jpg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Netlify has no mapping for the .webmanifest extension and falls back to
# octet-stream, which Chrome refuses to parse — the app name and icons in it
# would simply be ignored. Naming the type is the whole fix.
[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
